name: CI
on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Node ${{ matrix.node-version }} · ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node-version: [22, 24]
                include:
                    # macOS runners are scarce; OS-specific bugs rarely depend on the Node version.
                    - os: macos-latest
                      node-version: 24
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
            # Tests need the pinned @msilabs/alo. vsce's install script only sets up signature checks.
            - run: npm ci --ignore-scripts
            - run: npm test
