name: Publish
on:
    push:
        tags: ['v*']

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: write
        steps:
            # The release step below uses GH_TOKEN, so the token does not need to stay in .git/config.
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            - name: Tag must match package.json version
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
                    echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
                    exit 1
                  fi
            # vsce and the pinned @msilabs/alo come from package-lock.json. vsce's install script only
            # sets up signature checks, which packaging does not use.
            - run: npm ci --ignore-scripts
            - run: npm test
            - name: Package
              run: npm run package
            - name: Publish to Visual Studio Marketplace
              run: npm exec --no -- vsce publish --oidc --packagePath alo-vscode-${GITHUB_REF_NAME#v}.vsix
            # Attach the same .vsix to the GitHub release. If the release is not made yet, make it.
            - name: Attach the .vsix to the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  FILE=alo-vscode-${GITHUB_REF_NAME#v}.vsix
                  if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                    gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
                  else
                    gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
                  fi
